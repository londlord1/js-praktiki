<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ПР26 — Счётчик кликов</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f0f2f5;color:#212529}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:#fff;border-bottom:1px solid #e0e0e0}
  .topbar h1{margin:0;font-size:20px;color:#1c2333}
  .topbar .back{color:#3b5bdb;text-decoration:none;font-size:14px;font-weight:600}
  .wrap{max-width:760px;margin:24px auto;padding:0 16px}
  .task{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:22px 24px;margin-bottom:22px}
  .task h2{margin:0 0 14px;font-size:18px;color:#3b5bdb;border-bottom:2px solid #eef1f8;padding-bottom:10px}
  .card{background:#f8f9fc;border:1px solid #e6e9f2;border-radius:10px;padding:18px;margin-top:12px}
  .display{font-size:60px;font-weight:700;text-align:center;padding:18px;background:#fff;border-radius:10px;box-shadow:inset 0 2px 5px rgba(0,0,0,.06)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  button{padding:10px 18px;font-size:15px;border:none;border-radius:8px;cursor:pointer;color:#fff;background:#3b5bdb;transition:background .2s,transform .1s}
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  button:disabled{background:#c8ccd8;cursor:not-allowed;filter:none}
  .btn-green{background:#2f9e44}.btn-red{background:#e03131}.btn-gray{background:#868e96}.btn-orange{background:#f08c00}.btn-teal{background:#0c8599}
  input{padding:10px 12px;font-size:15px;border:2px solid #dfe2ea;border-radius:8px;outline:none;width:140px}
  input:focus{border-color:#3b5bdb}
  .warn{background:#ffe3e3;color:#c92a2a;border:1px solid #ffc9c9;padding:12px 14px;border-radius:8px;margin-top:12px;font-size:15px}
  .info{color:#666;font-size:14px;margin-top:8px}
  .bar{height:18px;background:#edf0f5;border-radius:9px;overflow:hidden;margin-top:12px}
  .bar>div{height:100%;background:#2f9e44;transition:width .3s ease,background .3s}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chips span{background:#eef1f8;color:#364fc7;padding:4px 10px;border-radius:14px;font-size:13px}
  .stepCtrl{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px}
  .stepCtrl button{padding:8px 14px;font-size:14px}
  .pill{display:inline-block;background:#eef1f8;color:#364fc7;padding:6px 14px;border-radius:16px;font-size:14px;font-weight:600}
</style><style>
/* ============================================================
   JSPraktiki — общая дизайн-система (добавляется в каждый файл)
   ============================================================ */
:root{
  --bg:#eef1f8;
  --surface:#ffffff;
  --ink:#1f2430;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#4f46e5;
  --accent-2:#4338ca;
  --accent-soft:#eef2ff;
  --ok:#16a34a;
  --bad:#dc2626;
  --warn:#d97706;
  --mono:"JetBrains Mono",Consolas,"SF Mono",Menlo,monospace;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 26px -14px rgba(16,24,40,.18);
}
html{scroll-behavior:smooth}
body{margin:0 auto;max-width:1180px;padding:0 20px 56px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
  background:var(--bg);background-image:radial-gradient(1200px 500px at 50% -10%,#fbfcff 0%,rgba(239,242,252,0) 55%);}
h1,h2,h3,h4{color:#1c2333;line-height:1.25;font-weight:700;letter-spacing:-.01em}

/* ---------- Шапка ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;
  gap:14px;flex-wrap:wrap;margin:0 -20px;padding:14px 24px;background:rgba(250,251,255,.72);
  backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);
  border-bottom:1px solid rgba(79,70,229,.12);box-shadow:0 1px 0 #fff inset;}
.topbar h1{margin:0;font-size:clamp(18px,2.5vw,26px);font-weight:750}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;
  font-size:14px;font-weight:650;padding:9px 16px;border-radius:999px;background:var(--accent-soft);
  border:1px solid rgba(79,70,229,.18);transition:background .15s,transform .1s}
.back:hover{background:#e0e7ff;transform:translateX(-1px)}
.topbar .back{margin:0}
.sub{color:var(--muted);font-size:14px;margin:14px 10px 22px}

/* ---------- Карточки заданий ---------- */
.card,.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;margin:18px 10px;box-shadow:var(--shadow)}
.card h2,.task h2{margin:0 0 14px;font-size:19px;font-weight:700;border:none;border-bottom:1px solid var(--line);
  padding:0 0 12px;display:flex;align-items:center;gap:9px}
.card h2::before,.task h2::before{content:"";flex:0 0 auto;width:5px;height:1.05em;
  background:linear-gradient(180deg,var(--accent),#7c3aed);border-radius:3px}
.card h3{font-size:16px;margin:16px 0 8px;color:#2a3350}
p{margin:6px 0}
a{color:var(--accent)}

/* ---------- Кнопки ---------- */
button{appearance:none;font-family:inherit;background:var(--accent);color:#fff;border:none;
  padding:10px 18px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;line-height:1.15;margin:4px;
  transition:filter .15s,transform .05s ease,box-shadow .15s,background .15s}
button:hover{filter:brightness(1.07)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid rgba(79,70,229,.35);outline-offset:2px}
button:disabled{background:#d1d5db;color:#f9fafb;cursor:not-allowed;box-shadow:none}
button.success,button .btn-green,.btn-green{background:var(--ok)}
button.danger,button .btn-red,.btn-red{background:var(--bad)}
button.second,button .btn-gray,.btn-gray{background:#6b7280}
.btn-orange,button.warning{background:var(--warn)}

/* ---------- Поля ввода ---------- */
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input::placeholder{color:#9aa3b2}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(79,70,229,.16)}
select{background-image:linear-gradient(45deg,transparent 50%,#6b7280 50%),linear-gradient(135deg,#6b7280 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;
  padding-right:30px;cursor:pointer}
label{font-size:13px;font-weight:650;color:#43506b;display:block;margin:8px 2px 4px}
.fg label{margin-top:12px}

/* ---------- Вывод результата ---------- */
.output{background:#0f172a;color:#e2e8f0;border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:14px 16px;margin:14px 2px 4px;font-family:var(--mono);
  font-size:13px;line-height:1.55;white-space:pre-wrap;min-height:46px;overflow-x:auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

/* ---------- Вспомогательное ---------- */
.row,.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 2px}
.hint{color:var(--muted);font-size:13px;margin:8px 2px;line-height:1.5}
.hint::before{content:"💡";margin-right:6px}
table{width:100%;border-collapse:collapse;margin:12px 0;background:#fff;border-radius:10px;
  overflow:hidden;font-size:14px;box-shadow:0 1px 0 rgba(16,24,40,.05)}
td,th{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{background:#f6f7fb;color:#3b4056;font-weight:650}
tr:nth-child(even) td{background:#fbfcff}
ul{padding-left:22px}

/* ---------- Оглавление (index.html) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:8px 16px 24px}
a.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
  text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s;display:block}
a.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(16,24,40,.25);border-color:var(--accent)}
a.card .num{font-size:12px;color:var(--accent);font-weight:750;letter-spacing:.04em}
a.card .title{font-size:16px;font-weight:650;margin:6px 0;color:#1c2333}
a.card .tasks{font-size:13px;color:var(--muted)}

/* ---------- Типографика результатов/статистики (React) ---------- */
.meta{font-size:12px;color:#9aa3b2}
.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.empty{text-align:center;color:#9aa3b2;padding:26px;background:#f8f9fc;border-radius:10px;border:1px dashed var(--line);margin-top:8px}
.lst{list-style:none;margin:0;padding:0}
.lst li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:15px}
.err{background:#fff1f1;color:#b02318;border:1px solid #ffcfcf;padding:12px 14px;border-radius:10px;text-align:center}
.loading{text-align:center;color:var(--muted);padding:24px;font-size:15px}

/* ---------- Адаптивность ---------- */
@media(max-width:720px){
  .card,.task{padding:18px 16px;margin:14px 6px}
  .topbar{margin:0 -20px;padding:12px 16px}
  .grid{grid-template-columns:1fr}
  .sub{margin-left:8px}
}</style>
</head><body>
<div class="topbar"><h1>ПР26 — Написание приложения React. Счётчик кликов</h1><a class="back" href="index.html">← Все работы</a></div>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

function CounterTask({ initial = 0, max = 20, stepDefault = 1 }) {
  const [count, setCount] = useState(initial);
  const [inputValue, setInputValue] = useState('');
  const [history, setHistory] = useState([]);
  const [step, setStep] = useState(stepDefault);

  const update = (newCount) => {
    const clamped = Math.max(0, Math.min(max, newCount));
    setCount(clamped);
    setHistory(prev => [...prev, clamped].slice(-30));
  };

  const inc = () => update(count + step);
  const dec = () => update(count - step);
  const reset = () => { setCount(0); };
  const double = () => update(count * 2);

  const handleInput = (e) => {
    const value = e.target.value;
    setInputValue(value);
    const n = Number(value);
    if (value !== '' && !isNaN(n)) setCount(Math.max(0, Math.min(max, Math.round(n))));
  };

  const histDedup = cnt => {
    setCount(cnt);
    setHistory(prev => [...prev, cnt].slice(-30));
  };

  const progress = Math.min((count / max) * 100, 100);
  const barColor = count > 15 ? '#e03131' : '#2f9e44';
  const textColor = count > 10 ? '#e03131' : (count < -5 ? '#e03131' : '#212529');

  return (
    <div>
      <div className="card">
        <div className="display" style={{ color: textColor }}>{count}</div>
        <div className="row">
          <button onClick={dec}>−{step}</button>
          <button onClick={inc}>+{step}</button>
          <button className="btn-green" onClick={double}>×2</button>
          <button className="btn-red" onClick={() => { setCount(0); setHistory(prev => [...prev, 0]); setInputValue(''); }}>Сброс</button>
        </div>

        <div className="stepCtrl">
          <span className="pill">Шаг: {step}</span>
          <button className="btn-gray" onClick={() => setStep(prev => Math.max(1, prev - 1))}>Шаг −1</button>
          <button className="btn-gray" onClick={() => setStep(prev => prev + 1)}>Шаг +1</button>
          <button className="btn-teal" onClick={() => setStep(10)}>Шаг ×10</button>
        </div>

        <div style={{ marginTop: 16, display: 'flex', gap: 10, justifyContent: 'center', alignItems: 'center' }}>
          <input type="number" value={inputValue} onChange={handleInput} placeholder="Введите число" />
          <button className="btn-orange" onClick={() => { inputValue !== '' && !isNaN(Number(inputValue)) && histDedup(Math.max(0, Math.min(max, Math.round(Number(inputValue))))); }}>Установить</button>
        </div>

        <div className="bar">
          <div style={{ width: `${progress}%`, background: barColor }} />
        </div>
        <div className="info">Прогресс: {Math.round(progress)}% (макс. {max}, при {max} кнопка «+{step}» блокируется)</div>

        {count >= max && <div className="warn">⚠️ Достигнут максимум ({max}) — увеличение заблокировано.</div>}
        {count < -5 && <div className="warn">⚠️ Счётчик опустился ниже −5!</div>}

        {history.length > 0 && (
          <div style={{ marginTop: 16 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <strong style={{ fontSize: 15 }}>История изменений ({history.length}):</strong>
              <button className="btn-gray" onClick={() => setHistory([])} style={{ fontSize: 13, padding: '4px 12px' }}>Очистить</button>
            </div>
            <div className="chips">
              {history.map((value, index) => <span key={index}>{value}</span>)}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function CounterWithLimits({ max = 20 }) {
  const [count, setCount] = useState(0);
  const inc = () => setCount(prev => Math.min(max, prev + 1));
  const dec = () => setCount(prev => Math.max(0, prev - 1));
  const progress = Math.min((count / max) * 100, 100);

  return (
    <div className="card">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
        <strong>Счётчик 0–{max}</strong>
        <span className="pill">{count}</span>
      </div>
      <div className="row">
        <button onClick={dec} disabled={count === 0} className="btn-red">−1</button>
        <button onClick={inc} disabled={count >= max} className="btn-green">+1</button>
        <button className="btn-gray" onClick={() => setCount(0)}>Сброс</button>
      </div>
      <div className="bar">
        <div style={{ width: `${progress}%`, background: count > 15 ? '#e03131' : '#2f9e44' }} />
      </div>
      <div className="info">При {max} кнопка «+1» заблокирована.</div>
    </div>
  );
}

function App() {
  return (
    <div className="wrap">
      <div className="task">
        <h2>Задание 1: Кнопка удвоения «×2»</h2>
        <p style={{ color: '#495057' }}>Добавлена кнопка, умножающая счётчик на 2 (с ограничением максимума).</p>
        <CounterTask stepDefault={1} />
      </div>

      <div className="task">
        <h2>Задание 2: Поле ввода произвольного числа</h2>
        <p style={{ color: '#495057' }}>Ввод числа мгновенно устанавливает счётчик; кнопка «Установить» фиксирует значение в истории.</p>
        <CounterTask />
      </div>

      <div className="task">
        <h2>Задание 3: История изменений</h2>
        <p style={{ color: '#495057' }}>Каждое изменение записывается в массив и отображается под счётчиком.</p>
        <CounterTask />
      </div>

      <div className="task">
        <h2>Задание 4: Счётчик с настройкой шага</h2>
        <p style={{ color: '#495057' }}>Кнопки «+Шаг» и «−Шаг» меняют величину шага; «Шаг ×10» задаёт шаг 10.</p>
        <CounterTask />
      </div>

      <div className="task">
        <h2>Задание 5: Визуализация счётчика (0–20)</h2>
        <p style={{ color: '#495057' }}>Прогресс-бар от 0 до 20; при достижении максимума кнопка «+1» блокируется.</p>
        <CounterWithLimits max={20} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
