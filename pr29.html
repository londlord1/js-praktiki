/* ============================================================
   JSPraktiki — общая дизайн-система (добавляется в каждый файл)
   ============================================================ */
:root{
  --bg:#eef1f8;
  --surface:#ffffff;
  --ink:#1f2430;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#4f46e5;
  --accent-2:#4338ca;
  --accent-soft:#eef2ff;
  --ok:#16a34a;
  --bad:#dc2626;
  --warn:#d97706;
  --mono:"JetBrains Mono",Consolas,"SF Mono",Menlo,monospace;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 26px -14px rgba(16,24,40,.18);
}
html{scroll-behavior:smooth}
body{margin:0 auto;max-width:1180px;padding:0 20px 56px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
  background:var(--bg);background-image:radial-gradient(1200px 500px at 50% -10%,#fbfcff 0%,rgba(239,242,252,0) 55%);}
h1,h2,h3,h4{color:#1c2333;line-height:1.25;font-weight:700;letter-spacing:-.01em}

/* ---------- Шапка ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;
  gap:14px;flex-wrap:wrap;margin:0 -20px;padding:14px 24px;background:rgba(250,251,255,.72);
  backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);
  border-bottom:1px solid rgba(79,70,229,.12);box-shadow:0 1px 0 #fff inset;}
.topbar h1{margin:0;font-size:clamp(18px,2.5vw,26px);font-weight:750}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;
  font-size:14px;font-weight:650;padding:9px 16px;border-radius:999px;background:var(--accent-soft);
  border:1px solid rgba(79,70,229,.18);transition:background .15s,transform .1s}
.back:hover{background:#e0e7ff;transform:translateX(-1px)}
.topbar .back{margin:0}
.sub{color:var(--muted);font-size:14px;margin:14px 10px 22px}

/* ---------- Карточки заданий ---------- */
.card,.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;margin:18px 10px;box-shadow:var(--shadow)}
.card h2,.task h2{margin:0 0 14px;font-size:19px;font-weight:700;border:none;border-bottom:1px solid var(--line);
  padding:0 0 12px;display:flex;align-items:center;gap:9px}
.card h2::before,.task h2::before{content:"";flex:0 0 auto;width:5px;height:1.05em;
  background:linear-gradient(180deg,var(--accent),#7c3aed);border-radius:3px}
.card h3{font-size:16px;margin:16px 0 8px;color:#2a3350}
p{margin:6px 0}
a{color:var(--accent)}

/* ---------- Кнопки ---------- */
button{appearance:none;font-family:inherit;background:var(--accent);color:#fff;border:none;
  padding:10px 18px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;line-height:1.15;margin:4px;
  transition:filter .15s,transform .05s ease,box-shadow .15s,background .15s}
button:hover{filter:brightness(1.07)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid rgba(79,70,229,.35);outline-offset:2px}
button:disabled{background:#d1d5db;color:#f9fafb;cursor:not-allowed;box-shadow:none}
button.success,button .btn-green,.btn-green{background:var(--ok)}
button.danger,button .btn-red,.btn-red{background:var(--bad)}
button.second,button .btn-gray,.btn-gray{background:#6b7280}
.btn-orange,button.warning{background:var(--warn)}

/* ---------- Поля ввода ---------- */
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input::placeholder{color:#9aa3b2}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(79,70,229,.16)}
select{background-image:linear-gradient(45deg,transparent 50%,#6b7280 50%),linear-gradient(135deg,#6b7280 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;
  padding-right:30px;cursor:pointer}
label{font-size:13px;font-weight:650;color:#43506b;display:block;margin:8px 2px 4px}
.fg label{margin-top:12px}

/* ---------- Вывод результата ---------- */
.output{background:#0f172a;color:#e2e8f0;border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:14px 16px;margin:14px 2px 4px;font-family:var(--mono);
  font-size:13px;line-height:1.55;white-space:pre-wrap;min-height:46px;overflow-x:auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

/* ---------- Вспомогательное ---------- */
.row,.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 2px}
.hint{color:var(--muted);font-size:13px;margin:8px 2px;line-height:1.5}
.hint::before{content:"💡";margin-right:6px}
table{width:100%;border-collapse:collapse;margin:12px 0;background:#fff;border-radius:10px;
  overflow:hidden;font-size:14px;box-shadow:0 1px 0 rgba(16,24,40,.05)}
td,th{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{background:#f6f7fb;color:#3b4056;font-weight:650}
tr:nth-child(even) td{background:#fbfcff}
ul{padding-left:22px}

/* ---------- Оглавление (index.html) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:8px 16px 24px}
a.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
  text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s;display:block}
a.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(16,24,40,.25);border-color:var(--accent)}
a.card .num{font-size:12px;color:var(--accent);font-weight:750;letter-spacing:.04em}
a.card .title{font-size:16px;font-weight:650;margin:6px 0;color:#1c2333}
a.card .tasks{font-size:13px;color:var(--muted)}

/* ---------- Типографика результатов/статистики (React) ---------- */
.meta{font-size:12px;color:#9aa3b2}
.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.empty{text-align:center;color:#9aa3b2;padding:26px;background:#f8f9fc;border-radius:10px;border:1px dashed var(--line);margin-top:8px}
.lst{list-style:none;margin:0;padding:0}
.lst li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:15px}
.err{background:#fff1f1;color:#b02318;border:1px solid #ffcfcf;padding:12px 14px;border-radius:10px;text-align:center}
.loading{text-align:center;color:var(--muted);padding:24px;font-size:15px}

/* ---------- Адаптивность ---------- */
@media(max-width:720px){
  .card,.task{padding:18px 16px;margin:14px 6px}
  .topbar{margin:0 -20px;padding:12px 16px}
  .grid{grid-template-columns:1fr}
  .sub{margin-left:8px}
}</style>
</head><body>
<div class="topbar"><h1>ПР29 — Асинхронные операции и внешние ресурсы React</h1><a class="back" href="index.html">← Все работы</a></div>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(Math.floor(sec % 60)).padStart(2, '0');
  return `${m}:${s}`;
}

function useCountdown({ onFinish, onTick }) {
  const [time, setTime] = useState(10);
  const [isActive, setIsActive] = useState(false);
  const [isFinished, setIsFinished] = useState(false);
  const ref = useRef(null);

  const setInitial = (sec) => {
    if (!isActive) { setTime(Math.max(0, sec)); setIsFinished(false); }
  };

  useEffect(() => {
    if (isActive && time > 0) {
      ref.current = setInterval(() => {
        setTime(prev => {
          if (prev <= 1) { setIsActive(false); setIsFinished(true); onFinish && onFinish(); return 0; }
          onTick && onTick(prev - 1);
          return prev - 1;
        });
      }, 1000);
    }
    return () => { if (ref.current) { clearInterval(ref.current); ref.current = null; } };
  }, [isActive, time]);

  const start = () => { if (time > 0) { setIsActive(true); setIsFinished(false); } };
  const pause = () => setIsActive(false);
  const reset = (sec) => { setIsActive(false); setIsFinished(false); setTime(sec); if (ref.current) { clearInterval(ref.current); ref.current = null; } };

  return { time, isActive, isFinished, start, pause, reset: () => reset(10), setInitial, setTimeRaw: setTime };
}

function BasicTimer() {
  const [initial, setInitial] = useState(10);
  const t = useCountdown({});
  const progress = initial > 0 ? ((initial - t.time) / initial) * 100 : 0;
  const color = t.isFinished ? '#e03131' : t.time <= 3 ? '#f08c00' : '#2f9e44';

  return (
    <div>
      <div className="timerBox">
        <div>
          <div className="bigTime" style={{ color }}>{formatTime(t.time)}</div>
          <div className="bar"><div style={{ width: `${progress}%`, background: color }} /></div>
        </div>
        <div>
          <p><b>Задание 2:</b> кнопки быстрой установки 5, 10, 30, 60 сек.</p>
          <div className="quick">
            {[5, 10, 30, 60].map(s => <button key={s} onClick={() => { t.setInitial(s); setInitial(s); }}>{s}с</button>)}
          </div>
          <div className="row">
            {!t.isActive && !t.isFinished && t.time > 0 && <button className="btn-green" onClick={t.start}>▶ Старт</button>}
            {t.isActive && <button className="btn-orange" onClick={t.pause}>⏸ Пауза</button>}
            {t.isFinished && <button className="btn-red" disabled>⏰ Время вышло!</button>}
            <button className="btn-gray" onClick={t.reset}>🔄 Сброс</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function MmSsTimer() {
  const [minutes, setMinutes] = useState(0);
  const [seconds, setSeconds] = useState(10);
  const total = minutes * 60 + seconds;
  const t = useCountdown({});

  const apply = () => { t.setInitial(total); t.setTimeRaw(total); };

  useEffect(() => { if (!t.isActive && !t.isFinished) { t.setTimeRaw(minutes * 60 + seconds); } }, [minutes, seconds]);

  return (
    <div>
      <p style={{ color: '#495057' }}><b>Задание 3:</b> установка минут и секунд отдельно (МИН 0–99, СЕК 0–59).</p>
      <div className="mmss">
        <input type="number" min="0" max="99" value={minutes} onChange={e => setMinutes(Math.max(0, parseInt(e.target.value) || 0))} />
        <span style={{ fontSize: 24, fontWeight: 700 }}>:</span>
        <input type="number" min="0" max="59" value={seconds} onChange={e => setSeconds(Math.max(0, Math.min(59, parseInt(e.target.value) || 0)))} />
        <button onClick={apply}>Установить</button>
      </div>
      <div className="row">
        <div className="bigTime" style={{ color: t.isFinished ? '#e03131' : '#2f9e44' }}>{formatTime(t.time)}</div>
      </div>
      <div className="row">
        {!t.isActive && !t.isFinished && t.time > 0 && <button className="btn-green" onClick={t.start}>▶ Старт</button>}
        {t.isActive && <button className="btn-orange" onClick={t.pause}>⏸ Пауза</button>}
        {t.isFinished && <button className="btn-red" disabled>⏰ Время вышло!</button>}
        <button className="btn-gray" onClick={() => t.reset()}>🔄 Сброс</button>
      </div>
    </div>
  );
}

function RingTimer() {
  const t = useCountdown({});
  const [initial, setInitial] = useState(60);
  const progress = initial > 0 ? ((initial - t.time) / initial) * 100 : 0;
  const r = 90, c = 2 * Math.PI * r;
  const offset = c * (1 - progress / 100);
  const color = t.isFinished ? '#e03131' : t.time <= 3 ? '#f08c00' : '#2f9e44';

  return (
    <div>
      <p style={{ color: '#495057' }}><b>Задание 4:</b> круговой SVG-индикатор. Цвет меняется в зависимости от оставшегося времени.</p>
      <div style={{ display: 'flex', justifyContent: 'center', gap: 20, flexWrap: 'wrap', alignItems: 'center' }}>
        <svg width="200" height="200">
          <circle cx="100" cy="100" r={r} fill="none" stroke="#e0e0e0" strokeWidth="12" />
          <circle cx="100" cy="100" r={r} fill="none" stroke={color} strokeWidth="12"
            strokeDasharray={c} strokeDashoffset={offset}
            style={{ transition: 'stroke-dashoffset .5s ease, stroke .3s', transform: 'rotate(-90deg)', transformOrigin: '50% 50%' }} />
          <text x="100" y="112" textAnchor="middle" fontSize="34" fontWeight="700" fill={color}>{formatTime(t.time)}</text>
        </svg>
        <div>
          <div className="row">
            {[10, 30, 60].map(s => <button key={s} style={{ background: '#eef1f8', color: '#364fc7' }} onClick={() => { t.setInitial(s); setInitial(s); }}>{s}с</button>)}
          </div>
          <div className="row">
            {!t.isActive && !t.isFinished && t.time > 0 && <button className="btn-green" onClick={t.start}>▶ Старт</button>}
            {t.isActive && <button className="btn-orange" onClick={t.pause}>⏸ Пауза</button>}
            {t.isFinished && <button className="btn-red" disabled>⏰ Время вышло!</button>}
            <button className="btn-gray" onClick={t.reset}>🔄 Сброс</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function MultiTimer() {
  const [timers, setTimers] = useState([{ id: 1, time: 10, initial: 10 }]);
  const active = useRef({});
  const finished = useRef({});

  const addTimer = () => setTimers(prev => [...prev, { id: prev.length > 0 ? Math.max(...prev.map(x => x.id)) + 1 : 1, time: 10, initial: 10 }]);

  const removeTimer = (id) => setTimers(prev => prev.filter(x => x.id !== id));

  const update = (id, patch) => setTimers(prev => prev.map(x => x.id === id ? { ...x, ...patch } : x));

  useEffect(() => {
    const interval = setInterval(() => {
      setTimers(prev => prev.map(t => {
        if (active.current[t.id] && t.time > 0) {
          if (t.time <= 1) { active.current[t.id] = false; finished.current[t.id] = true; return { ...t, time: 0 }; }
          return { ...t, time: t.time - 1 };
        }
        return t;
      }));
    }, 1000);
    return () => clearInterval(interval);
  }, []);

  return (
    <div>
      <p style={{ color: '#495057' }}><b>Задание 5:</b> несколько независимых таймеров, каждый работает по отдельности.</p>
      <div className="row">
        <button style={{ background: '#0c8599' }} onClick={addTimer}>＋ Добавить таймер</button>
      </div>
      {timers.map((t, i) => {
        const color = finished.current[t.id] ? '#e03131' : (active.current[t.id] && t.time <= 3) ? '#f08c00' : '#2f9e44';
        const progress = t.initial > 0 ? ((t.initial - t.time) / t.initial) * 100 : 0;
        const idx = 'т' + (i + 1);
        return (
          <div className="timerItem" key={t.id}>
            <div className="head">
              <span className="lbl">Таймер {idx}</span>
              <span className="status">{active.current[t.id] ? '⏳ работает' : finished.current[t.id] ? '⏰ завершён' : '⏸ пауза'}</span>
              <button className="btn-red" onClick={() => removeTimer(t.id)} style={{ fontSize: 12, padding: '4px 10px' }}>Удалить</button>
            </div>
            <div style={{ textAlign: 'center', fontSize: 32, fontWeight: 700, color, padding: 8 }}>{formatTime(t.time)}</div>
            <div className="bar"><div style={{ width: `${progress}%`, background: color }} /></div>
            <div className="row">
              {!active.current[t.id] && !finished.current[t.id] && t.time > 0 && <button className="btn-green" onClick={() => { active.current[t.id] = true; finished.current[t.id] = false; }}>▶</button>}
              {active.current[t.id] && <button className="btn-orange" onClick={() => active.current[t.id] = false}>⏸</button>}
              <button className="btn-gray" onClick={() => { active.current[t.id] = false; finished.current[t.id] = false; update(t.id, { time: 10, initial: 10 }); }}>🔄</button>
              <input type="number" min="1" max="60" value={t.initial} onChange={e => { const v = Math.max(1, parseInt(e.target.value) || 1); update(t.id, { initial: v, time: v }); finished.current[t.id] = false; active.current[t.id] = false; }} style={{ width: 60 }} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

function App() {
  return (
    <div className="wrap">
      <div className="task">
        <h2>Задание 1: Основной таймер + быстрые кнопки (5/10/30/60)</h2>
        <BasicTimer />
      </div>
      <div className="task">
        <h2>Задание 3: Установка минут и секунд отдельно</h2>
        <MmSsTimer />
      </div>
      <div className="task">
        <h2>Задание 4: Круговой прогресс (SVG)</h2>
        <RingTimer />
      </div>
      <div className="task">
        <h2>Задание 5: Несколько таймеров одновременно</h2>
        <MultiTimer />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
