<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ПР30 — React: обмен данными через API</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f0f2f5;color:#212529}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:#fff;border-bottom:1px solid #e0e0e0}
  .topbar h1{margin:0;font-size:20px;color:#1c2333}
  .topbar .back{color:#3b5bdb;text-decoration:none;font-size:14px;font-weight:600}
  .wrap{max-width:820px;margin:24px auto;padding:0 16px}
  .task{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:22px 24px;margin-bottom:22px}
  .task h2{margin:0 0 14px;font-size:18px;color:#3b5bdb;border-bottom:2px solid #eef1f8;padding-bottom:10px}
  .spinner{display:inline-block;width:36px;height:36px;border:4px solid #eef1f8;border-top:4px solid #3b5bdb;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{text-align:center;color:#666;padding:30px;font-size:15px}
  .err{background:#ffe3e3;color:#c92a2a;border:1px solid #ffc9c9;padding:12px 14px;border-radius:8px;text-align:center}
  .quote{background:#fff;border-radius:10px;padding:22px;box-shadow:0 4px 10px rgba(0,0,0,.08);margin-top:14px;border-left:5px solid #3b5bdb}
  .quote .q{font-size:22px;line-height:1.55;font-style:italic;color:#333;margin:10px 0 16px}
  .quote .author{font-weight:700;color:#555}
  button{padding:9px 15px;font-size:14px;border:none;border-radius:8px;cursor:pointer;color:#fff;background:#3b5bdb}
  button:hover{filter:brightness(1.08)}
  button:disabled{background:#c8ccd8;cursor:not-allowed}
  .btn-green{background:#2f9e44}.btn-orange{background:#f08c00}.btn-gray{background:#868e96}.btn-red{background:#e03131}
  input,select{padding:10px 12px;font-size:15px;border:2px solid #dfe2ea;border-radius:8px;outline:none}
  input:focus,select:focus{border-color:#3b5bdb}
  select{background:#fff;cursor:pointer}
  .form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .suggest{background:#fff;border:1px solid #dfe2ea;border-radius:8px;list-style:none;margin:4px 0 0;padding:0;position:relative;z-index:5;box-shadow:0 4px 10px rgba(0,0,0,.1)}
  .suggest li{padding:9px 12px;cursor:pointer;font-size:14px}
  .suggest li:hover{background:#eef1f8}
  .quoteList .item{display:flex;justify-content:space-between;gap:10px;padding:10px;background:#f8f9fc;border:1px solid #e6e9f2;border-radius:8px;margin-bottom:8px;font-size:14px}
  .favList{padding:0;list-style:none;margin:10px 0}
  .favList li{background:#f8f9fc;border:1px solid #e6e9f2;border-radius:8px;padding:10px;margin-bottom:8px;font-size:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2f9e44;color:#fff;padding:10px 20px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:100}
  .pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}
  .meta{font-size:12px;color:#999;margin-top:6px}
  .gradWrap{background:linear-gradient(135deg,#3b5bdb,#7048e8,#9c36b5);border-radius:14px;padding:30px;color:#fff;position:relative;margin-top:14px}
  .gradWrap .q{font-size:24px;line-height:1.6;min-height:60px}
</style><style>
/* ============================================================
   JSPraktiki — общая дизайн-система (добавляется в каждый файл)
   ============================================================ */
:root{
  --bg:#eef1f8;
  --surface:#ffffff;
  --ink:#1f2430;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#4f46e5;
  --accent-2:#4338ca;
  --accent-soft:#eef2ff;
  --ok:#16a34a;
  --bad:#dc2626;
  --warn:#d97706;
  --mono:"JetBrains Mono",Consolas,"SF Mono",Menlo,monospace;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 26px -14px rgba(16,24,40,.18);
}
html{scroll-behavior:smooth}
body{margin:0 auto;max-width:1180px;padding:0 20px 56px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
  background:var(--bg);background-image:radial-gradient(1200px 500px at 50% -10%,#fbfcff 0%,rgba(239,242,252,0) 55%);}
h1,h2,h3,h4{color:#1c2333;line-height:1.25;font-weight:700;letter-spacing:-.01em}

/* ---------- Шапка ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;
  gap:14px;flex-wrap:wrap;margin:0 -20px;padding:14px 24px;background:rgba(250,251,255,.72);
  backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);
  border-bottom:1px solid rgba(79,70,229,.12);box-shadow:0 1px 0 #fff inset;}
.topbar h1{margin:0;font-size:clamp(18px,2.5vw,26px);font-weight:750}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;
  font-size:14px;font-weight:650;padding:9px 16px;border-radius:999px;background:var(--accent-soft);
  border:1px solid rgba(79,70,229,.18);transition:background .15s,transform .1s}
.back:hover{background:#e0e7ff;transform:translateX(-1px)}
.topbar .back{margin:0}
.sub{color:var(--muted);font-size:14px;margin:14px 10px 22px}

/* ---------- Карточки заданий ---------- */
.card,.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;margin:18px 10px;box-shadow:var(--shadow)}
.card h2,.task h2{margin:0 0 14px;font-size:19px;font-weight:700;border:none;border-bottom:1px solid var(--line);
  padding:0 0 12px;display:flex;align-items:center;gap:9px}
.card h2::before,.task h2::before{content:"";flex:0 0 auto;width:5px;height:1.05em;
  background:linear-gradient(180deg,var(--accent),#7c3aed);border-radius:3px}
.card h3{font-size:16px;margin:16px 0 8px;color:#2a3350}
p{margin:6px 0}
a{color:var(--accent)}

/* ---------- Кнопки ---------- */
button{appearance:none;font-family:inherit;background:var(--accent);color:#fff;border:none;
  padding:10px 18px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;line-height:1.15;margin:4px;
  transition:filter .15s,transform .05s ease,box-shadow .15s,background .15s}
button:hover{filter:brightness(1.07)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid rgba(79,70,229,.35);outline-offset:2px}
button:disabled{background:#d1d5db;color:#f9fafb;cursor:not-allowed;box-shadow:none}
button.success,button .btn-green,.btn-green{background:var(--ok)}
button.danger,button .btn-red,.btn-red{background:var(--bad)}
button.second,button .btn-gray,.btn-gray{background:#6b7280}
.btn-orange,button.warning{background:var(--warn)}

/* ---------- Поля ввода ---------- */
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input::placeholder{color:#9aa3b2}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(79,70,229,.16)}
select{background-image:linear-gradient(45deg,transparent 50%,#6b7280 50%),linear-gradient(135deg,#6b7280 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;
  padding-right:30px;cursor:pointer}
label{font-size:13px;font-weight:650;color:#43506b;display:block;margin:8px 2px 4px}
.fg label{margin-top:12px}

/* ---------- Вывод результата ---------- */
.output{background:#0f172a;color:#e2e8f0;border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:14px 16px;margin:14px 2px 4px;font-family:var(--mono);
  font-size:13px;line-height:1.55;white-space:pre-wrap;min-height:46px;overflow-x:auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

/* ---------- Вспомогательное ---------- */
.row,.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 2px}
.hint{color:var(--muted);font-size:13px;margin:8px 2px;line-height:1.5}
.hint::before{content:"💡";margin-right:6px}
table{width:100%;border-collapse:collapse;margin:12px 0;background:#fff;border-radius:10px;
  overflow:hidden;font-size:14px;box-shadow:0 1px 0 rgba(16,24,40,.05)}
td,th{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{background:#f6f7fb;color:#3b4056;font-weight:650}
tr:nth-child(even) td{background:#fbfcff}
ul{padding-left:22px}

/* ---------- Оглавление (index.html) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:8px 16px 24px}
a.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
  text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s;display:block}
a.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(16,24,40,.25);border-color:var(--accent)}
a.card .num{font-size:12px;color:var(--accent);font-weight:750;letter-spacing:.04em}
a.card .title{font-size:16px;font-weight:650;margin:6px 0;color:#1c2333}
a.card .tasks{font-size:13px;color:var(--muted)}

/* ---------- Типографика результатов/статистики (React) ---------- */
.meta{font-size:12px;color:#9aa3b2}
.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.empty{text-align:center;color:#9aa3b2;padding:26px;background:#f8f9fc;border-radius:10px;border:1px dashed var(--line);margin-top:8px}
.lst{list-style:none;margin:0;padding:0}
.lst li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:15px}
.err{background:#fff1f1;color:#b02318;border:1px solid #ffcfcf;padding:12px 14px;border-radius:10px;text-align:center}
.loading{text-align:center;color:var(--muted);padding:24px;font-size:15px}

/* ---------- Адаптивность ---------- */
@media(max-width:720px){
  .card,.task{padding:18px 16px;margin:14px 6px}
  .topbar{margin:0 -20px;padding:12px 16px}
  .grid{grid-template-columns:1fr}
  .sub{margin-left:8px}
}</style>
</head><body>
<div class="topbar"><h1>ПР30 — React: обмен данными через API</h1><a class="back" href="index.html">← Все работы</a></div>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const API = 'https://dummyjson.com';
const norm = (raw) => ({ id: raw.id, content: raw.quote, author: raw.author, tags: [] });

function useQuotes() {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [quote, setQuote] = useState(null);
  const [toast, setToast] = useState('');

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 1800); };

  const fetchOne = async (author = '') => {
    setLoading(true); setError(null);
    try {
      if (author.trim()) {
        const res = await fetch(`${API}/quotes/search?q=${encodeURIComponent(author.trim())}`);
        if (!res.ok) throw new Error(`Ошибка HTTP: ${res.status}`);
        const data = await res.json();
        const list = data.quotes || [];
        if (list.length === 0) throw new Error(`Автор "${author}" не найден`);
        setQuote(norm(list[Math.floor(Math.random() * list.length)]));
      } else {
        const res = await fetch(`${API}/quotes/random`);
        if (!res.ok) throw new Error(`Ошибка HTTP: ${res.status}`);
        setQuote(norm(await res.json()));
      }
    } catch (e) { setError(e.message); setQuote(null); }
    finally { setLoading(false); }
  };

  useEffect(() => { fetchOne(); }, []);
  return { loading, error, quote, fetchOne, toast, setToast, showToast };
}

function CopyButton({ quote }) {
  const [copied, setCopied] = useState(false);
  const share = async () => {
    if (!quote) return;
    const text = `«${quote.content}» — ${quote.author}`;
    try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 1500); }
    catch { setCopied(false); }
  };
  return <button className="btn-orange" onClick={share}>{copied ? '✓ Скопировано' : '📋 Поделиться/копировать'}</button>;
}

function Task1() {
  const { loading, error, quote, fetchOne, toast } = useQuotes();
  return (
    <div>
      <p style={{ color: '#495057' }}>Кнопка копирует цитату в буфер обмена. Панель ниже использует тот же компонент.</p>
      <div className="form">
        <button onClick={() => fetchOne()}>🎲 Случайная</button>
        {quote && <CopyButton quote={quote} />}
      </div>
      {loading && <div className="loading"><div className="spinner" /><p>Загрузка цитаты...</p></div>}
      {error && <div className="err">❌ {error}</div>}
      {!loading && !error && quote && (
        <div className="quote">
          <p className="q">«{quote.content}»</p>
          <span className="author">— {quote.author}</span>
        </div>
      )}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function Task2() {
  const [count, setCount] = useState(3);
  const [quotes, setQuotes] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const load = async () => {
    setLoading(true); setError('');
    try {
      const res = await fetch(`${API}/quotes?limit=${count}`);
      if (!res.ok) throw new Error('Не удалось загрузить');
      const data = await res.json();
      setQuotes((data.quotes || []).map(norm));
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };
  useEffect(() => { load(); }, []);

  return (
    <div>
      <p style={{ color: '#495057' }}>Выбор количества загружаемых цитат (1, 3, 5, 10).</p>
      <div className="form">
        <select value={count} onChange={e => setCount(Number(e.target.value))}>
          <option value={1}>1 цитата</option><option value={3}>3 цитаты</option><option value={5}>5 цитат</option><option value={10}>10 цитат</option>
        </select>
        <button onClick={load} disabled={loading}>{loading ? 'Загрузка...' : 'Загрузить'}</button>
      </div>
      {error && <div className="err">❌ {error}</div>}
      <div className="quoteList">
        {quotes.map((q, i) => (
          <div className="item" key={q.id}>
            <span>«{q.content}» — <b>{q.author}</b></span>
            <span className="meta">#{i + 1}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function Task3() {
  const { loading, error, quote, fetchOne } = useQuotes();
  const [text, setText] = useState('');
  const [suggestions, setSuggestions] = useState([]);
  const [called, setCalled] = useState(false);

  const searchAuthors = async (q) => {
    if (q.trim().length < 2) { setSuggestions([]); return; }
    try {
      const res = await fetch(`${API}/quotes/search?q=${encodeURIComponent(q.trim())}`);
      const data = await res.json();
      const seen = new Set(); const arr = [];
      (data.quotes || []).forEach(qo => { const a = qo.author; if (a && !seen.has(a)) { seen.add(a); arr.push({ name: a }); } });
      setSuggestions(arr);
    } catch { setSuggestions([]); }
  };

  return (
    <div>
      <p style={{ color: '#495057' }}>При вводе ≥2 символов появляются подсказки авторов. Клик по автору загружает его цитату.</p>
      <div style={{ position: 'relative' }}>
        <input style={{ width: '100%', boxSizing: 'border-box' }} placeholder="Введите имя автора (напр. Albert Einstein)..." value={text}
          onChange={e => { setText(e.target.value); searchAuthors(e.target.value); }} />
        {suggestions.length > 0 && (
          <ul className="suggest">
            {suggestions.slice(0, 6).map(s => (
              <li key={s.name} onClick={() => { setText(s.name); setSuggestions([]); }}>
                {s.name}
              </li>
            ))}
          </ul>
        )}
      </div>
      <div style={{ marginTop: 10 }}>
        <button disabled={!text.trim()} onClick={() => { setCalled(true); fetchOne(text); }}>Показать цитату автора</button>
      </div>
      {called && !loading && !error && quote && (
        <div className="quote"><p className="q">«{quote.content}»</p><span className="author">— {quote.author}</span></div>
      )}
    </div>
  );
}

function Task4() {
  const { loading, error, quote, fetchOne } = useQuotes();
  const [favorites, setFavorites] = useState(() => { try { return JSON.parse(localStorage.getItem('pr30-fav') || '[]'); } catch { return []; } });
  useEffect(() => { localStorage.setItem('pr30-fav', JSON.stringify(favorites)); }, [favorites]);

  const isFav = quote && favorites.some(f => f.id === quote.id);
  const toggle = () => {
    if (!quote) return;
    setFavorites(prev => isFav ? prev.filter(f => f.id !== quote.id) : [quote, ...prev]);
  };
  const removeFav = (id) => setFavorites(prev => prev.filter(f => f.id !== id));

  return (
    <div>
      <p style={{ color: '#495057' }}>Избранные цитаты сохраняются в LocalStorage.</p>
      <div className="form"><button onClick={() => fetchOne()}>🎲 Случайная</button>{quote && <button className={isFav ? 'btn-red' : 'btn-green'} onClick={toggle}>{isFav ? '⭐ В избранном' : '☆ Добавить в избранное'}</button>}</div>
      {loading && <div className="loading"><div className="spinner" /></div>}
      {error && <div className="err">❌ {error}</div>}
      {!loading && !error && quote && (
        <div className="quote"><p className="q">«{quote.content}»</p><span className="author">— {quote.author}</span></div>
      )}
      <h3 style={{ marginTop: 18, color: '#495057' }}>Избранное ({favorites.length})</h3>
      {favorites.length === 0 && <div className="loading">Пока пусто. Добавьте цитату кнопкой выше.</div>}
      <ul className="favList">
        {favorites.map(f => (
          <li key={f.id}>
            <div><span>«{f.content}» — <b>{f.author}</b></span></div>
            <button className="btn-red" style={{ marginTop: 6, fontSize: 12, padding: '4px 10px' }} onClick={() => removeFav(f.id)}>Удалить</button>
          </li>
        ))}
      </ul>
    </div>
  );
}

function Task5() {
  const [page, setPage] = useState(1);
  const [totalPages, setTotalPages] = useState(0);
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const limit = 5;

  const loadPage = async (p) => {
    setLoading(true); setError('');
    try {
      const res = await fetch(`${API}/quotes?limit=${limit}&skip=${(p - 1) * limit}`);
      if (!res.ok) throw new Error('Ошибка загрузки');
      const data = await res.json();
      setList((data.quotes || []).map(norm)); setTotalPages(Math.max(1, Math.ceil((data.total || 0) / limit)));
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };
  useEffect(() => { loadPage(1); }, []);

  const go = (p) => { if (p >= 1 && p <= totalPages) { setPage(p); loadPage(p); } };

  return (
    <div>
      <p style={{ color: '#495057' }}>Постраничный просмотр списка цитат (по {limit} на страницу).</p>
      {error && <div className="err">❌ {error}</div>}
      {loading && <div className="loading"><div className="spinner" /></div>}
      <div className="quoteList">
        {list.map(q => <div className="item" key={q.id}><span>«{q.content}» — <b>{q.author}</b></span></div>)}
      </div>
      <div className="pager">
        <button disabled={page <= 1} onClick={() => go(page - 1)}>← Назад</button>
        <span>Страница {page} из {totalPages}</span>
        <button disabled={page >= totalPages} onClick={() => go(page + 1)}>Вперёд →</button>
      </div>
    </div>
  );
}

function Task7() {
  const { loading, error, quote, fetchOne } = useQuotes();
  const [display, setDisplay] = useState('');

  useEffect(() => {
    if (!quote) return;
    setDisplay('');
    let i = 0;
    const text = quote.content;
    const id = setInterval(() => {
      if (i <= text.length) { setDisplay(text.slice(0, i)); i++; } else clearInterval(id);
    }, 25);
    return () => clearInterval(id);
  }, [quote]);

  return (
    <div>
      <p style={{ color: '#495057' }}>«Цитата дня» с градиентным фоном, эффектом печатной машинки и кнопкой смены цитаты.</p>
      <div className="form"><button onClick={() => fetchOne()}>🔄 Новая цитата дня</button></div>
      {loading && <div className="loading"><div className="spinner" /></div>}
      {error && <div className="err">❌ {error}</div>}
      {!loading && !error && quote && (
        <div className="gradWrap">
          <div className="q">{display || '...'}</div>
          <div style={{ marginTop: 14, fontWeight: 700, opacity: .9 }}>— {quote.author}</div>
        </div>
      )}
