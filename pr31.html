<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ПР31 — React: формы, списки</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f0f2f5;color:#212529}

  .exprBar{background:#f8f9fc;border:1px solid #e6e9f2;border-radius:8px;padding:12px;font-family:monospace;font-size:16px;min-height:30px;margin-bottom:8px}
  .activeField{outline:3px solid #3b5bdb}
</style><style>
/* ============================================================
   JSPraktiki — общая дизайн-система (добавляется в каждый файл)
   ============================================================ */
:root{
  --bg:#eef1f8;
  --surface:#ffffff;
  --ink:#1f2430;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#4f46e5;
  --accent-2:#4338ca;
  --accent-soft:#eef2ff;

  --bad:#dc2626;

  --radius:14px;

}
html{scroll-behavior:smooth}
body{margin:0 auto;max-width:1180px;padding:0 20px 56px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
  background:var(--bg);background-image:radial-gradient(1200px 500px at 50% -10%,#fbfcff 0%,rgba(239,242,252,0) 55%);}
h1,h2,h3,h4{color:#1c2333;line-height:1.25;font-weight:700;letter-spacing:-.01em}

/* ---------- Шапка ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;
  gap:14px;flex-wrap:wrap;margin:0 -20px;padding:14px 24px;background:rgba(250,251,255,.72);
  backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);
  border-bottom:1px solid rgba(79,70,229,.12);box-shadow:0 1px 0 #fff inset;}
.topbar h1{margin:0;font-size:clamp(18px,2.5vw,26px);font-weight:750}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;
  font-size:14px;font-weight:650;padding:9px 16px;border-radius:999px;background:var(--accent-soft);
  border:1px solid rgba(79,70,229,.18);transition:background .15s,transform .1s}
.back:hover{background:#e0e7ff;transform:translateX(-1px)}
.topbar .back{margin:0}
.sub{color:var(--muted);font-size:14px;margin:14px 10px 22px}

/* ---------- Карточки заданий ---------- */
.card,.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;margin:18px 10px;box-shadow:var(--shadow)}
.card h2,.task h2{margin:0 0 14px;font-size:19px;font-weight:700;border:none;border-bottom:1px solid var(--line);
  padding:0 0 12px;display:flex;align-items:center;gap:9px}
.card h2::before,.task h2::before{content:"";flex:0 0 auto;width:5px;height:1.05em;
  background:linear-gradient(180deg,var(--accent),#7c3aed);border-radius:3px}
.card h3{font-size:16px;margin:16px 0 8px;color:#2a3350}
p{margin:6px 0}
a{color:var(--accent)}

/* ---------- Кнопки ---------- */
button{appearance:none;font-family:inherit;background:var(--accent);color:#fff;border:none;
  padding:10px 18px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;line-height:1.15;margin:4px;
  transition:filter .15s,transform .05s ease,box-shadow .15s,background .15s}
button:hover{filter:brightness(1.07)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid rgba(79,70,229,.35);outline-offset:2px}
button:disabled{background:#d1d5db;color:#f9fafb;cursor:not-allowed;box-shadow:none}
button.success,button .btn-green,.btn-green{background:var(--ok)}
button.danger,button .btn-red,.btn-red{background:var(--bad)}
button.second,button .btn-gray,.btn-gray{background:#6b7280}
.btn-orange,button.warning{background:var(--warn)}

/* ---------- Поля ввода ---------- */
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input::placeholder{color:#9aa3b2}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(79,70,229,.16)}
select{background-image:linear-gradient(45deg,transparent 50%,#6b7280 50%),linear-gradient(135deg,#6b7280 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;
  padding-right:30px;cursor:pointer}
label{font-size:13px;font-weight:650;color:#43506b;display:block;margin:8px 2px 4px}
.fg label{margin-top:12px}

/* ---------- Вывод результата ---------- */
.output{background:#0f172a;color:#e2e8f0;border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:14px 16px;margin:14px 2px 4px;font-family:var(--mono);
  font-size:13px;line-height:1.55;white-space:pre-wrap;min-height:46px;overflow-x:auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

/* ---------- Вспомогательное ---------- */
.row,.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 2px}
.hint{color:var(--muted);font-size:13px;margin:8px 2px;line-height:1.5}

table{width:100%;border-collapse:collapse;margin:12px 0;background:#fff;border-radius:10px;
  overflow:hidden;font-size:14px;box-shadow:0 1px 0 rgba(16,24,40,.05)}
td,th{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{background:#f6f7fb;color:#3b4056;font-weight:650}
tr:nth-child(even) td{background:#fbfcff}
ul{padding-left:22px}

/* ---------- Оглавление (index.html) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:8px 16px 24px}
a.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
  text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s;display:block}
a.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(16,24,40,.25);border-color:var(--accent)}
a.card .num{font-size:12px;color:var(--accent);font-weight:750;letter-spacing:.04em}
a.card .title{font-size:16px;font-weight:650;margin:6px 0;color:#1c2333}
a.card .tasks{font-size:13px;color:var(--muted)}

/* ---------- Типографика результатов/статистики (React) ---------- */
.meta{font-size:12px;color:#9aa3b2}
.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.empty{text-align:center;color:#9aa3b2;padding:26px;background:#f8f9fc;border-radius:10px;border:1px dashed var(--line);margin-top:8px}
.lst{list-style:none;margin:0;padding:0}
.lst li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:15px}
.err{background:#fff1f1;color:#b02318;border:1px solid #ffcfcf;padding:12px 14px;border-radius:10px;text-align:center}
.loading{text-align:center;color:var(--muted);padding:24px;font-size:15px}

/* ---------- Адаптивность ---------- */
@media(max-width:720px){
  .card,.task{padding:18px 16px;margin:14px 6px}
  .topbar{margin:0 -20px;padding:12px 16px}
  .grid{grid-template-columns:1fr}
  .sub{margin-left:8px}
}</style>
</head><body>
<div class="topbar"><h1>ПР31 — React: формы, списки (калькулятор)</h1><a class="back" href="index.html">← Все работы</a></div>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function BaseCalculator({ extraOps }) {
  const ops = [ ...(extraOps || []) ];
  const [num1, setNum1] = useState('');
  const [num2, setNum2] = useState('');
  const [operation, setOperation] = useState('+');
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const [history, setHistory] = useState([]);

  const symbol = (op) => ({ '+': '+', '-': '−', '*': '×', '/': '÷', '%': '%', '^': '^' }[op] || op);

  const calculate = () => {
    if (num1 === '' || num2 === '') { setError('Введите оба числа'); setResult(null); return; }
    const a = parseFloat(num1), b = parseFloat(num2);
    if (isNaN(a) || isNaN(b)) { setError('Введите корректные числа'); setResult(null); return; }
    let r, s;
    switch (operation) {
      case '+': r = a + b; s = '+'; break;
      case '-': r = a - b; s = '−'; break;
      case '*': r = a * b; s = '×'; break;
      case '/':
        if (b === 0) { setError('На ноль делить нельзя!'); setResult(null); return; }
        r = a / b; s = '÷'; break;
      case '%':
        if (b === 0) { setError('На ноль делить нельзя!'); setResult(null); return; }
        r = a % b; s = '%'; break;
      case '^': r = Math.pow(a, b); s = '^'; break;
      default: setError('Неизвестная операция'); setResult(null); return;
    }
    if (!Number.isFinite(r)) { setError('Результат слишком большой'); setResult(null); return; }
    const rounded = Math.round(r * 1e10) / 1e10;
    setResult(rounded); setError('');
    setHistory(prev => [{ id: Date.now(), text: `${a} ${s} ${b} = ${rounded}`, time: new Date().toLocaleTimeString() }, ...prev].slice(0, 20));
  };

  const reset = () => { setNum1(''); setNum2(''); setResult(null); setError(''); };
  const change = (fn, v) => { fn(v); setResult(null); setError(''); };

  useEffect(() => {
    const hk = (e) => {
      if (e.key === 'Escape') reset();
    };
    window.addEventListener('keydown', hk);
    return () => window.removeEventListener('keydown', hk);
  }, []);

  return (
    <div>
      <form className="calcForm" onSubmit={e => { e.preventDefault(); calculate(); }}>
        <div className="field"><label>Число 1</label>
          <input type="number" step="any" value={num1} onChange={e => change(setNum1, e.target.value)} /></div>
        <div className="field"><label>Операция</label>
          <select value={operation} onChange={e => change(setOperation, e.target.value)}>
            <option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option>
            <option value="%">% (остаток)</option><option value="^">^ (степень)</option>
          </select></div>
        <div className="field"><label>Число 2</label>
          <input type="number" step="any" value={num2} onChange={e => change(setNum2, e.target.value)} /></div>
        <div className="field"><button type="submit" className="btn-green">= Вычислить</button></div>
        <div className="field"><button type="button" className="btn-gray" onClick={reset}>Сброс</button></div>
      </form>
      {error && <div className="errorBox">⚠️ {error}</div>}
      {result !== null && !error && <div className="resultOk">{parseFloat(num1)} {symbol(operation)} {parseFloat(num2)} = <b>{result}</b></div>}
      <ul className="hist">
        {history.map(h => <li key={h.id}><span>{h.text}</span><span style={{ color: '#999', fontSize: 12 }}>{h.time}</span></li>)}
      </ul>
    </div>
  );
}

function PadCalculator() {
  const [active, setActive] = useState('num1');
  const [num1, setNum1] = useState('');
  const [num2, setNum2] = useState('');
  const [operation, setOperation] = useState('+');
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');

  const append = (v) => {
    const setter = active === 'num1' ? setNum1 : setNum2;
    setter(prev => prev + v); setResult(null); setError('');
  };
  const calc = () => {
    const a = parseFloat(num1), b = parseFloat(num2);
    if (isNaN(a) || isNaN(b)) { setError('Введите оба числа'); setResult(null); return; }
    let r;
    switch (operation) {
      case '+': r = a + b; break;
      case '-': r = a - b; break;
      case '*': r = a * b; break;
      case '/': if (b === 0) { setError('На ноль делить нельзя!'); setResult(null); return; } r = a / b; break;
      default: r = null;
    }
    setResult(Math.round(r * 1e10) / 1e10); setError('');
  };
  const clearField = () => { (active === 'num1' ? setNum1 : setNum2)(''); setResult(null); };
  const keys = ['7','8','9','/','4','5','6','*','1','2','3','-','0','.','C','+'];
  const handleKey = (k) => {
    if (k === 'C') clearField();
    else if (k === '=') calc();
    else if (k === '+' || k === '-' || k === '*' || k === '/') setOperation(k);
    else append(k);
  };

  const setOp = (op) => { setOperation(op); setResult(null); };

  return (
    <div>
      <div className="calcForm">
        <div className="field"><label>Число 1</label>
          <input disabled={active !== 'num1'} className={active === 'num1' ? 'activeField' : ''} value={num1} readOnly /></div>
        <div className="field"><label>Операция</label>
          <select value={operation} onChange={e => setOp(e.target.value)}>
            <option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select>
        </div>
        <div className="field"><label>Число 2</label>
          <input disabled={active !== 'num2'} className={active === 'num2' ? 'activeField' : ''} value={num2} readOnly /></div>
        <div className="field">
          <button className="btn-gray" onClick={() => setActive(active === 'num1' ? 'num2' : 'num1')}>Поле: {active === 'num1' ? '№1' : '№2'}</button>
        </div>
      </div>
      <div className="pad">
        {keys.map(k => <button key={k} className={k === '/' || k === '*' ? 'btn-orange' : ''} onClick={() => handleKey(k)}>{k}</button>)}
        <button className="eq btn-green" onClick={calc}>=</button>
      </div>
      {error && <div className="errorBox">⚠️ {error}</div>}
      {result !== null && !error && <div className="resultOk">Результат: <b>{result}</b></div>}
    </div>
  );
}

function BaseConverter() {
  const [base, setBase] = useState(10);
  const [num1, setNum1] = useState('');
  const [num2, setNum2] = useState('');
  const [operation, setOperation] = useState('+');
  const [result, setResult] = useState('');
  const [error, setError] = useState('');

  const calc = () => {
    const a = parseInt(num1, base), b = parseInt(num2, base);
    if (isNaN(a) || isNaN(b)) { setError('Неверный ввод для выбранной системы'); setResult(''); return; }
    let r;
    switch (operation) {
      case '+': r = a + b; break;
      case '-': r = a - b; break;
      case '*': r = a * b; break;
      case '/': if (b === 0) { setError('На ноль делить нельзя!'); setResult(''); return; } r = a / b; break;
      default: r = 0;
    }
    setError('');
    setResult(r.toString(base).toUpperCase());
  };

  return (
    <div>
      <div className="calcForm">
        <div className="field"><label>Система</label>
          <select value={base} onChange={e => { setBase(Number(e.target.value)); setResult(''); setError(''); }}>
            <option value={2}>BIN</option><option value={8}>OCT</option><option value={10}>DEC</option><option value={16}>HEX</option>
          </select></div>
        <div className="field"><label>Число 1</label><input value={num1} onChange={e => setNum1(e.target.value)} placeholder="напр. FF" /></div>
        <div className="field"><label>Операция</label>
          <select value={operation} onChange={e => setOperation(e.target.value)}>
            <option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select></div>
        <div className="field"><label>Число 2</label><input value={num2} onChange={e => setNum2(e.target.value)} /></div>
        <div className="field"><button className="btn-green" onClick={calc}>= Вычислить</button></div>
      </div>
      {error && <div className="errorBox">⚠️ {error}</div>}
      {!error && result !== '' && <div className="resultOk">Результат ({['','','BIN','','OCT','','','','DEC','','','','','','','HEX'][base]}): <b>{result}</b></div>}
    </div>
  );
}

function MemoryCalc() {
  const [num1, setNum1] = useState('');
  const [num2, setNum2] = useState('');
  const [operation, setOperation] = useState('+');
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const [memory, setMemory] = useState(0);

  const calc = () => {
    const a = parseFloat(num1), b = parseFloat(num2);
    if (isNaN(a) || isNaN(b)) { setError('Введите оба числа'); setResult(null); return; }
    let r;
    switch (operation) {
      case '+': r = a + b; break;
      case '-': r = a - b; break;
      case '*': r = a * b; break;
      case '/': if (b === 0) { setError('На ноль делить нельзя!'); setResult(null); return; } r = a / b; break;
      default: r = 0;
    }
    setResult(Math.round(r * 1e10) / 1e10); setError('');
  };
  const reset = () => { setNum1(''); setNum2(''); setResult(null); setError(''); };

  return (
    <div>
      <div className="calcForm">
        <div className="field"><label>Число 1</label><input type="number" value={num1} onChange={e => setNum1(e.target.value)} /></div>
        <div className="field"><label>Операция</label>
          <select value={operation} onChange={e => setOperation(e.target.value)}>
            <option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select></div>
        <div className="field"><label>Число 2</label><input type="number" value={num2} onChange={e => setNum2(e.target.value)} /></div>
        <div className="field"><button className="btn-green" onClick={calc}>Вычислить</button></div>
        <div className="field"><button className="btn-gray" onClick={reset}>Сброс</button></div>
      </div>
      {error && <div className="errorBox">⚠️ {error}</div>}
      {result !== null && !error && <div className="resultOk">Результат: <b>{result}</b></div>}
      <div className="memRow">
        <button onClick={() => result !== null && setMemory(prev => prev + result)}>M+</button>
        <button onClick={() => result !== null && setMemory(prev => prev - result)}>M−</button>
        <button onClick={() => { setResult(memory); setError(''); }}>MR</button>
        <button onClick={() => setMemory(0)}>MC</button>
        <span className="memVal">Память: {memory}</span>
      </div>
    </div>
  );
}

function SciCalc() {
  const [expr, setExpr] = useState('');
  const [result, setResult] = useState('');
  const [error, setError] = useState('');

  const add = (t) => { setExpr(prev => prev + t); setError(''); };
  const fact = (n) => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };

  const evalExpr = () => {
    try {
      let s = expr;
      s = s.replace(/π/g, Math.PI).replace(/e\b(?![a-z])/g, Math.E).replace(/\^/g, '**');
      s = s.replace(/sin\(/g, 'Math.sin(').replace(/cos\(/g, 'Math.cos(').replace(/tan\(/g, 'Math.tan(');
      s = s.replace(/log\(/g, (m) => { return 'Math.log10('; }).replace(/ln\(/g, 'Math.log(');
      const match = s.match(/(\d+)!/);
      if (match) s = s.replace(match[0], fact(parseInt(match[1])));
      const val = Function(`"use strict"; return (${s})`)();
      if (isNaN(val)) throw new Error();
      setResult('= ' + Math.round(val * 1e8) / 1e8);
      setError('');
    } catch (e) { setError('Ошибка выражения'); setResult(''); }
  };

  const sciKeys = [
    ['sin(', 'cos(', 'tan(', 'π', 'e'],
    ['log(', 'ln(', '√', '^', '!'],
    ['(', ')', '7', '8', '9'],
    ['4', '5', '6', '+', '-'],
    ['1', '2', '3', '*', '/'],
    ['0', '.', 'C', '=', 'AC']
  ];

  return (
    <div>
      <div className="exprBar" style={{ fontSize: 20 }}>{expr || 'Введите выражение'}</div>
      {result && <div className="resultOk">{result}</div>}
      {error && <div className="errorBox">⚠️ {error}</div>}
      <div className="sciGrid">
        {sciKeys.flat().map(k => (
          <button key={k + Math.random()} style={{ fontSize: 15 }} onClick={() => {
            if (k === 'C') setExpr(prev => prev.slice(0, -1));
            else if (k === 'AC') { setExpr(''); setResult(''); setError(''); }
            else if (k === '=') evalExpr();
            else if (k === '√') add('Math.sqrt(');
            else add(k);
          }}>{k}</button>
        ))}
      </div>
    </div>
  );
}

function App() {
  return (
    <div className="wrap">
      <div className="task">
        <h2>Задание 1–2: Операции «%» и «^» + история</h2>
        <p style={{ color: '#495057' }}>Калькулятор поддерживает остаток от деления и возведение в степень, деление на ноль обрабатывается, история сохраняется. Esc сбрасывает форму.</p>
        <BaseCalculator />
      </div>
      <div className="task">
        <h2>Задание 4: Цифровая клавиатура</h2>

        <PadCalculator />
      </div>
      <div className="task">
        <h2>Задание 5: Конвертация систем счисления</h2>
        <p style={{ color: '#495057' }}>Ввод и результат в DEC, BIN, HEX, OCT (например, FF in HEX + 1 = 100).</p>
        <BaseConverter />
      </div>
      <div className="task">
        <h2>Задание 6: Память калькулятора (M+/M−/MR/MC)</h2>
        <MemoryCalc />
      </div>
      <div className="task">
        <h2>Задание 7: Научный калькулятор</h2>
        <p style={{ color: '#495057' }}>sin, cos, tan, log, ln, √, факториал (!), константы π и e, скобки.</p>
        <SciCalc />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
